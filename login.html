<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Kredora</title>
  <meta name="description" content="Log in to your Kredora account to manage evidence and view skill analytics." />
  <link rel="icon" type="image/svg+xml" href="kredora-logo.svg" />
  <link rel="alternate icon" href="kredora-logo.png" type="image/png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {

          
          colors: {
            base: "#080B12",
            surface: "#0D111A",
            surface2: "#111722",
            elevated: "#151C29",
            borderc: "#202938",
            ink: "#F4F7FB",
            inkdim: "#98A2B3",
            muted: "#667085",
            brand: {
              DEFAULT: "#7C5CFC",
              bright: "#9D85FF",
              hover: "#6E4DEE",
              dim: "#4C39A8",
              glow: "rgba(124, 92, 252, 0.35)",
            },
            gold: {
              DEFAULT: "#7C5CFC",
              dim: "#4C39A8",
              bright: "#9D85FF",
            },
            cyan: {
              DEFAULT: "#4CC9F0",
            },
            success: "#32D583",
            warning: "#FDB022",
            danger: {
              DEFAULT: "#F97066",
              bright: "#FDA29B",
            },
          },
          fontFamily: {
            display: ['"Space Grotesk"', '"Inter"', "ui-sans-serif", "sans-serif"],
            sans: ['"Inter"', "ui-sans-serif", "sans-serif"],
            mono: ['"JetBrains Mono"', "ui-monospace", "monospace"],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="min-h-screen bg-base text-ink flex flex-col justify-between antialiased relative overflow-x-hidden">
  <!-- Ambient backdrop blur orb -->
  <div class="fixed top-1/4 left-1/2 -translate-x-1/2 w-[600px] h-[400px] bg-brand/15 rounded-full blur-[140px] pointer-events-none -z-10"></div>
  <div class="fixed bottom-10 right-1/4 w-[420px] h-[300px] bg-cyan/10 rounded-full blur-[120px] pointer-events-none -z-10"></div>

  <!-- Top bar with Back to Home -->
  <header class="w-full px-6 py-5 border-b border-white/10 bg-[#080c16]/70 backdrop-blur-xl">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 group text-sm text-inkdim hover:text-white transition-colors">
        <svg class="w-4 h-4 transition-transform group-hover:-translate-x-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Back to Kredora</span>
      </a>

      <div class="flex items-center gap-3 text-xs text-inkdim font-mono">
        <span>Need an account?</span>
        <a href="signup.html" class="text-brand-bright hover:underline font-semibold">Sign up →</a>
      </div>
    </div>
  </header>

  <!-- Main Login Container -->
  <main class="flex-1 flex items-center justify-center px-5 py-12 relative z-10 page-enter">
    <div class="w-full max-w-md">

      <!-- Brand Logo -->
      <div class="text-center mb-8">
        <a href="index.html" class="inline-flex items-center gap-3 group">
          <svg class="h-8 w-auto transition-transform group-hover:scale-105 shrink-0" viewBox="0 0 240 150" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Kredora Logo">
            <defs>
            <linearGradient id="kredora-logo-grad-login" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#9D85FF" />
              <stop offset="100%" stop-color="#7C5CFC" />
            </linearGradient>
            </defs>
            <g fill="url(#kredora-logo-grad-login)">
              <path d="M 4,0 L 108,0 C 90,32 52,65 0,68 L 0,4 C 0,1.8 1.8,0 4,0 Z" />
              <path d="M 0,82 C 52,85 90,118 108,150 L 4,150 C 1.8,150 0,148.2 0,146 L 0,82 Z" />
              <path d="M 138,0 L 236,0 C 238.2,0 240,1.8 240,4 L 240,146 C 240,148.2 238.2,150 236,150 L 138,150 C 122,125 102,96 86,75 C 102,54 122,25 138,0 Z" />
            </g>
          </svg>
          <span class="font-display font-bold text-2xl tracking-tight text-white">Kredora</span>
        </a>
      </div>

      <!-- Auth Card -->
      <div class="glass-card rounded-3xl p-8 sm:p-9 shadow-2xl relative overflow-hidden border border-white/10 backdrop-blur-2xl bg-surface/75">

        <!-- Header -->
        <div class="text-center mb-7">
          <p class="font-mono text-xs uppercase tracking-[0.2em] text-cyan mb-2">Secure Authentication</p>
          <h1 class="font-display text-2xl sm:text-3xl font-bold text-white tracking-tight">Welcome back</h1>
          <p class="mt-2 text-sm text-inkdim">Sign in to continue building your verified skill proof.</p>
        </div>

        <!-- Status / Alert message -->
        <div id="statusMessage" class="hidden mb-5 p-3.5 rounded-xl text-xs font-mono leading-relaxed"></div>

        <!-- Form -->
        <form id="loginForm" class="space-y-5" novalidate>

          <div>
            <label for="loginUsername" class="mb-2 block text-xs font-mono uppercase tracking-wider text-inkdim">
              Email
            </label>
            <div class="relative">
              <input
                id="loginUsername"
                type="email"
                required
                autocomplete="email"
                placeholder="you@example.com"
                class="w-full rounded-xl border border-white/10 bg-black/30 px-4 py-3 text-white text-sm outline-none transition focus:border-brand focus:ring-1 focus:ring-brand/40">
              <span class="absolute right-3.5 top-3.5 text-inkdim">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>
              </span>
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-2">
              <label for="loginPassword" class="text-xs font-mono uppercase tracking-wider text-inkdim">
                Password
              </label>
              <button type="button" id="forgotBtn" class="text-xs text-inkdim hover:text-brand-bright transition-colors">
                Forgot password?
              </button>
            </div>
            <div class="relative">
              <input
                id="loginPassword"
                type="password"
                required
                autocomplete="current-password"
                placeholder="••••••••"
                class="w-full rounded-xl border border-white/10 bg-black/30 px-4 py-3 text-white text-sm outline-none transition focus:border-brand focus:ring-1 focus:ring-brand/40 pr-10">
              <button
                type="button"
                id="togglePasswordBtn"
                aria-label="Show password"
                class="absolute right-3.5 top-3.5 text-inkdim hover:text-white transition-colors">
                <svg id="eyeIcon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg id="eyeOffIcon" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"/></svg>
              </button>
            </div>
          </div>

          <div class="flex items-center justify-between text-xs text-inkdim">
            <label class="flex items-center gap-2 cursor-pointer select-none">
              <input type="checkbox" id="rememberMe" checked class="rounded border-white/20 bg-black/30 text-brand focus:ring-brand/30">
              <span>Remember this session</span>
            </label>
          </div>

          <p id="loginError" class="hidden text-xs text-danger font-mono bg-danger/10 border border-danger/20 backdrop-blur-sm p-2.5 rounded-lg"></p>

          <button
            type="submit"
            id="submitBtn"
            class="w-full rounded-lg bg-brand py-3 text-sm font-semibold text-white transition-all hover:bg-brand-bright active:scale-[0.99] flex items-center justify-center gap-2 shadow-lg shadow-brand/25">
            <span>Sign In</span>
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>

        </form>

        <!-- Seamless Switch to Sign Up -->
        <div class="mt-8 pt-6 border-t border-white/5 text-center text-sm text-inkdim">
          <span>Don't have an account?</span>
          <a href="signup.html" class="text-brand-bright font-semibold hover:underline ml-1">
            Create an account
          </a>
        </div>

      </div>

      <!-- Security guarantee banner -->
      <div class="mt-6 flex items-center justify-center gap-2 text-xs text-inkdim/70 font-mono">
        <svg class="w-3.5 h-3.5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>Encrypted session · Evidence verification pipeline</span>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full px-6 py-4 text-center text-xs text-inkdim/60 border-t border-white/5 backdrop-blur-md bg-[#080c16]/40">
    © <span id="current-year"></span> Kredora. All rights reserved.
  </footer>

  <script type="module" src="js/supabase-client.js"></script>
  <script type="module" src="js/site-config.js"></script>
  <script type="module" src="js/data.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const yearEl = document.getElementById("current-year");
      if (yearEl) yearEl.textContent = new Date().getFullYear();

      // Check if user is already authenticated (Supabase Auth session)
      if (window.Auth && (await window.Auth.isAuthenticated())) {
        const redirect = new URLSearchParams(window.location.search).get("redirect");
        window.location.href = redirect ? decodeURIComponent(redirect) : "dashboard.html";
        return;
      }

      // Read query params for flash alerts
      const params = new URLSearchParams(window.location.search);
      const statusMessage = document.getElementById("statusMessage");

      if (params.get("msg") === "auth_required") {
        statusMessage.textContent = "Please log in to access your dashboard and verified evidence.";
        statusMessage.className = "mb-5 p-3 rounded-xl text-xs font-mono leading-relaxed bg-amber-500/10 border border-amber-500/20 text-amber-300 block";
      } else if (params.get("loggedOut") === "true") {
        statusMessage.textContent = "You have been securely signed out.";
        statusMessage.className = "mb-5 p-3 rounded-xl text-xs font-mono leading-relaxed bg-cyan/10 border border-cyan/20 text-cyan block";
      } else if (params.get("registered") === "true") {
        statusMessage.textContent = "Account created successfully! Please sign in with your credentials.";
        statusMessage.className = "mb-5 p-3 rounded-xl text-xs font-mono leading-relaxed bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 block";
      }

      // Toggle password visibility
      const togglePasswordBtn = document.getElementById("togglePasswordBtn");
      const passwordInput = document.getElementById("loginPassword");
      const eyeIcon = document.getElementById("eyeIcon");
      const eyeOffIcon = document.getElementById("eyeOffIcon");

      togglePasswordBtn.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        eyeIcon.classList.toggle("hidden", isPassword);
        eyeOffIcon.classList.toggle("hidden", !isPassword);
      });

      // Forgot password: send a reset email via Supabase Auth (requires the
      // email to be filled in above).
      document.getElementById("forgotBtn").addEventListener("click", async () => {
        const email = document.getElementById("loginUsername").value.trim();
        const result = await window.Auth.requestPasswordReset(email);
        statusMessage.textContent = result.message;
        statusMessage.className = result.success
          ? "mb-5 p-3 rounded-xl text-xs font-mono leading-relaxed bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 block"
          : "mb-5 p-3 rounded-xl text-xs font-mono leading-relaxed bg-gold/10 border border-gold/30 text-gold block";
      });

      // Handle form submission
      const loginForm = document.getElementById("loginForm");
      const loginError = document.getElementById("loginError");
      const submitBtn = document.getElementById("submitBtn");

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        loginError.classList.add("hidden");

        const email = document.getElementById("loginUsername").value.trim();
        const password = document.getElementById("loginPassword").value;

        if (!email) {
          loginError.textContent = "Please enter your email.";
          loginError.classList.remove("hidden");
          return;
        }
        if (!password) {
          loginError.textContent = "Please enter your password.";
          loginError.classList.remove("hidden");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = `
          <svg class="animate-spin h-4 w-4 text-base" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span>Signing In...</span>
        `;

        // Supabase Auth sign-in — the only authentication path in the app.
        const result = await window.Auth.login(email, password);

        if (!result.success) {
          loginError.textContent = result.message || "Invalid credentials.";
          loginError.classList.remove("hidden");
          submitBtn.disabled = false;
          submitBtn.innerHTML = `
            <span>Sign In</span>
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          `;
          return;
        }

        // Successful login: redirect
        const redirect = params.get("redirect");
        window.location.href = redirect ? decodeURIComponent(redirect) : "dashboard.html";
      });
    });
  </script>
</body>
</html>
